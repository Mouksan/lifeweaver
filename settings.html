<div id="lifeweaver_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>🌙 Lifeweaver</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="lw_enabled">
                <input id="lw_enabled" type="checkbox" />
                Включено
            </label>

            <hr>

            <p><i>Фундамент собран. Вселенные, цикл, беременность, дети и семейное древо появятся на следующих этапах.</i></p>

            <label for="lw_chat_note">Тестовая заметка на этот чат:</label>
            <textarea id="lw_chat_note" class="text_pole" rows="2"
                placeholder="Напиши что-нибудь, переключись на другой чат и вернись — тут должно остаться то же самое, а в другом чате быть пусто"></textarea>
        </div>
    </div>
</div>
